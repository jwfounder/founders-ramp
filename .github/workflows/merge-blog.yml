name: One-off merge blog 2026-10-02
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase blog/2026-10-02 onto main and fast-forward main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin blog/2026-10-02
          NR=$(git rev-parse FETCH_HEAD)
          test "$(git rev-parse --short=7 "$NR")" = "3c6b5b2"
          OLD=$(git merge-base HEAD "$NR")
          git log -1 --oneline "$OLD"
          git rm -q .github/workflows/merge-blog.yml
          git commit -q -m "Remove one-off blog merge workflow"
          BASE=$(git rev-parse HEAD)
          git checkout -q -b nr "$NR"
          git rebase --onto "$BASE" "$OLD" nr
          CHANGED=$(git diff --name-only "$BASE" HEAD | grep -v '^writings/' | grep -v '^assets/writings/' | grep -v '^assets/newsroom/' | grep -v '^briefing/' | grep -v '^sitemap.xml$' | grep -v '^llms.txt$' || true)
          if [ -n "$CHANGED" ]; then echo "Unexpected paths: $CHANGED"; exit 1; fi
          git diff --quiet "$BASE" HEAD -- home css
          test ! -e .github/workflows/merge-blog.yml
          test ! -e .github/workflows/blog-build.yml
          test ! -e .blogbuild
          test "$(grep -c '<loc>' sitemap.xml)" = "30"
          grep -q '^## Answers' llms.txt
          grep -c 'ref-wide' home/index.html
          git log --oneline -8
          git push origin HEAD:main
