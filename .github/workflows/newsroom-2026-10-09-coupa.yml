name: Newsroom 2026-10-09 Coupa assemble (one-off, removes itself)
on:
  push:
    branches: [newsroom/2026-10-09]
    paths: [".github/workflows/newsroom-2026-10-09-coupa.yml"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newsroom/2026-10-09
          fetch-depth: 0
      - run: pip install pillow
      - name: Add card, refresh home strip, build images, remove one-off
        run: |
          python3 <<'PY'
          import pathlib, re
          slug = "2026-10-09-coupa-business-spend-index-it-services"
          url = "https://www.coupa.com/newsroom/coupas-latest-q3-business-spend-index-report-finds-spend-held-firm-through-six-months-of-market-and-tariff-shocks/"
          title = "Coupa's Latest Q3 Business Spend Index Report Finds Spend Held Firm Through Six Months of Market and Tariff Shocks"
          alt = "Bright illustration card reading Tech companies shift spend to IT services, with bars showing IT services rising from 8.8% to 14.1% of spend and software falling from 12.5% to 8.6%"
          source = "Coupa"
          body = "Inside tech companies, IT services rose from 8.8% to 14.1% of spend while software's share fell from 12.5% to 8.6%. Buyers are paying for the people who make new tools work, so spell out who does each setup step and by when."
          img = f'<span class="thumb"><img src="../assets/newsroom/{slug}.webp" alt="{alt}" width="720" height="378" loading="lazy" decoding="async"></span>'
          meta = '<span class="news-meta"><span class="news-topic">Buyers and markets</span> <time datetime="2026-10-09">2026-10-09</time></span>'
          I = " " * 10
          bcard = (f'{I}<a class="card news" href="{url}" target="_blank" rel="noopener" data-topic="buyers">\n'
                   f'{I}  {img}\n{I}  <div class="news-body">\n{I}    {meta}\n{I}    <h3>{title}</h3>\n'
                   f'{I}    <p>{body}</p>\n{I}    <span class="news-source">{source}</span>\n{I}  </div>\n{I}</a>\n')
          hcard = (f'{I}<a class="card news" href="{url}" target="_blank" rel="noopener">\n'
                   f'{I}  {img}\n{I}  <div class="news-body">\n{I}    {meta}\n{I}    <h3>{title}</h3>\n'
                   f'{I}    <span class="news-source">{source}</span>\n{I}  </div>\n{I}</a>\n')
          b = pathlib.Path("briefing/index.html"); s = b.read_text(encoding="utf-8")
          assert url not in s
          a = '        <div class="cards news-grid">\n'; assert s.count(a) == 1
          s = s.replace(a, a + bcard, 1)
          s = s.replace('aria-pressed="true">All <span>34</span>', 'aria-pressed="true">All <span>35</span>', 1)
          s = s.replace('Buyers and markets <span>8</span>', 'Buyers and markets <span>9</span>', 1)
          assert 'All <span>35</span>' in s and 'Buyers and markets <span>9</span>' in s
          assert s.count('class="card news"') == 35 and s.count('data-topic="buyers"') == 9, (s.count('class="card news"'), s.count('data-topic="buyers"'))
          b.write_text(s, encoding="utf-8")
          h = pathlib.Path("home/index.html"); s = h.read_text(encoding="utf-8")
          a = '        <div class="cards news-strip">\n'; assert s.count(a) == 1
          s = s.replace(a, a + hcard, 1)
          # drop the oldest (Zylo) card so the strip shows the latest 3
          strip0 = s.split('cards news-strip')[1].split('<section')[0]
          hrefs = re.findall(r'<a class="card news" href="([^"]+)"', strip0)
          assert len(hrefs) == 4, hrefs
          last = re.escape(hrefs[-1])
          s, n = re.subn(r' {10}<a class="card news" href="' + last + r'" target="_blank" rel="noopener">\n.*?</a>\n', "", s, count=1, flags=re.S)
          assert n == 1
          strip = s.split('cards news-strip')[1].split('<section')[0]
          assert strip.count('class="card news"') == 3, strip.count('class="card news"')
          h.write_text(s, encoding="utf-8")
          H1 = "<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&display=block'><style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}\n.h{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-.005em;line-height:.95}\n.kick{font-family:'IBM Plex Sans';font-weight:600;letter-spacing:.14em;text-transform:uppercase}\n.brand{display:flex;align-items:center;gap:16px}\n.brand img{border-radius:10px;display:block;object-fit:cover}\n.brand .wm{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;text-transform:uppercase}\nhtml,body{width:1200px;height:1200px;overflow:hidden}\nbody{background:#0b0b0d;color:#f5f5f4;position:relative}\n.wrap{position:absolute;inset:72px 84px 60px 84px;display:flex;flex-direction:column}\n.top{display:flex;justify-content:space-between;align-items:center}\n.top .kick{color:#e10600;font-size:26px}\n.top .date{color:#a8a29e;font-size:24px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}\n.big{color:#e10600;font-size:360px;line-height:.82;margin-top:30px;letter-spacing:-.02em}\n.lede{font-size:54px;line-height:1.08;font-weight:600;margin-top:18px;max-width:960px}\n.stats{display:flex;gap:28px;margin-top:36px}\n.stat{flex:1;border-top:4px solid #2a2a2e;padding-top:18px}\n.stat b{font-family:'Barlow Condensed';font-size:84px;line-height:.9;color:#f5f5f4;display:block}\n.stat span{font-size:28px;line-height:1.25;color:#d6d3d1;display:block;margin-top:8px}\n.take{margin-top:auto;margin-bottom:0;background:#FBF5E6;color:#0b0b0d;padding:30px 36px;border-left:12px solid #e10600}\n.take .kick{font-size:22px;color:#c10500}\n.take .t{font-size:60px;margin-top:8px}\n.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-top:28px}\n.src{font-size:21px;line-height:1.35;color:#a8a29e;max-width:800px}\n.brand img{width:64px;height:64px}\n.brand .wm{font-size:30px;color:#f5f5f4}\n</style></head><body><div class='wrap'>\n<div class='top'><span class='kick'>Founders Ramp Newsroom · Buyers and markets</span><span class='date'>Oct 9, 2026</span></div>\n<div class='big h'>14.1%</div>\n<div class='lede'>of tech companies' spend now goes to IT services, up from 8.8%.</div>\n<div class='stats'>\n <div class='stat'><b>8.6%</b><span>software's share, down from 12.5%, even as software dollars rose</span></div>\n <div class='stat'><b>+6.5%</b><span>tech spend growth through June, through a 13.2% Nasdaq drop</span></div>\n</div>\n<div class='take'><div class='kick'>Founder takeaway</div><div class='t h'>Write down who makes it work, and by when.</div></div>\n<div class='foot'><div class='src'>Source: Coupa Q3 2026 Business Spend Index Report, built from purchase orders, contracts and renewals across Coupa's buyer and supplier network. Released Oct 8, 2026.</div><div class='brand'><img src='LOGOSRC'><span class='wm'>Founders Ramp</span></div></div>\n</div></body></html>"
          H2 = "<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&display=block'><style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}\n.h{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-.005em;line-height:.95}\n.kick{font-family:'IBM Plex Sans';font-weight:600;letter-spacing:.14em;text-transform:uppercase}\n.brand{display:flex;align-items:center;gap:16px}\n.brand img{border-radius:10px;display:block;object-fit:cover}\n.brand .wm{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;text-transform:uppercase}\nhtml,body{width:1600px;height:900px;overflow:hidden}\nbody{background:#0b0b0d;color:#f5f5f4;position:relative}\n.wrap{position:absolute;inset:64px 76px 56px 76px;display:grid;grid-template-columns:600px 1fr;grid-template-rows:auto 1fr auto;column-gap:64px}\n.top{grid-column:1/3;display:flex;justify-content:space-between;align-items:center}\n.top .kick{color:#e10600;font-size:24px}\n.top .date{color:#a8a29e;font-size:22px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}\n.left{display:flex;flex-direction:column;justify-content:center}\n.big{color:#e10600;font-size:290px;line-height:.82;letter-spacing:-.02em}\n.lede{font-size:45px;line-height:1.1;font-weight:600;margin-top:20px}\n.right{display:flex;flex-direction:column;justify-content:center;gap:30px}\n.stats{display:flex;gap:28px}\n.stat{flex:1;border-top:4px solid #2a2a2e;padding-top:16px}\n.stat b{font-family:'Barlow Condensed';font-size:80px;line-height:.9;display:block}\n.stat span{font-size:26px;line-height:1.25;color:#d6d3d1;display:block;margin-top:8px}\n.take{background:#FBF5E6;color:#0b0b0d;padding:28px 32px;border-left:12px solid #e10600}\n.take .kick{font-size:20px;color:#c10500}\n.take .t{font-size:58px;margin-top:10px}\n.foot{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-top:24px}\n.src{font-size:20px;line-height:1.35;color:#a8a29e;max-width:1100px}\n.brand img{width:56px;height:56px}\n.brand .wm{font-size:28px}\n</style></head><body><div class='wrap'>\n<div class='top'><span class='kick'>Founders Ramp Newsroom · Buyers and markets</span><span class='date'>Oct 9, 2026</span></div>\n<div class='left'><div class='big h'>14.1%</div><div class='lede'>of tech companies' spend now goes to IT services, up from 8.8%.</div></div>\n<div class='right'>\n <div class='stats'>\n  <div class='stat'><b>8.6%</b><span>software's share, down from 12.5%, even as software dollars rose</span></div>\n  <div class='stat'><b>+6.5%</b><span>tech spend growth through June, through a 13.2% Nasdaq drop</span></div>\n </div>\n <div class='take'><div class='kick'>Founder takeaway</div><div class='t h'>Write down who makes it work, and by when.</div></div>\n</div>\n<div class='foot'><div class='src'>Source: Coupa Q3 2026 Business Spend Index Report, built from purchase orders, contracts and renewals across Coupa's buyer and supplier network. Released Oct 8, 2026.</div><div class='brand'><img src='LOGOSRC'><span class='wm'>Founders Ramp</span></div></div>\n</div></body></html>"
          # custom bright WebP for the card
          from PIL import Image, ImageDraw, ImageFont
          import io, os, subprocess, tempfile
          W,H=720,378
          im=Image.new("RGB",(W,H),(16,185,129)); d=ImageDraw.Draw(im)
          d.rectangle([0,0,W,28],fill=(139,92,246)); d.rectangle([0,H-28,W,H],fill=(250,204,21))
          d.rounded_rectangle([44,52,W-44,H-52],radius=20,fill=(255,255,255))
          B="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"; R="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          lg=ImageFont.truetype(B,30); md=ImageFont.truetype(B,20); sm=ImageFont.truetype(R,18)
          d.text((72,72),"Tech companies shift spend",fill=(15,23,42),font=lg)
          d.text((72,110),"to IT services",fill=(15,23,42),font=lg)
          d.text((72,156),"Coupa Business Spend Index, share of High Tech spend",fill=(71,85,105),font=sm)
          rows=[("IT services",8.8,14.1,(14,165,233)),("Software",12.5,8.6,(249,115,22))]
          x0,maxw=230,250
          for i,(lab,a1,b1,c) in enumerate(rows):
              y=196+i*58
              d.text((72,y+12),lab,fill=(30,41,59),font=md)
              wa=int(maxw*a1/14.1); wb=int(maxw*b1/14.1)
              d.rounded_rectangle([x0,y,x0+wa,y+20],radius=5,fill=(203,213,225))
              d.text((x0+wa+8,y),f"{a1}% before",fill=(100,116,139),font=sm)
              d.rounded_rectangle([x0,y+26,x0+wb,y+46],radius=5,fill=c)
              d.text((x0+wb+8,y+26),f"{b1}% now",fill=(30,41,59),font=md)
          out=pathlib.Path(f"assets/newsroom/{slug}.webp"); out.parent.mkdir(parents=True,exist_ok=True)
          im.save(out,"WEBP",quality=82,method=6)
          # social key-number cards (dark Newsroom style), rendered with headless Chrome
          CHROME=os.environ.get("CHROME","google-chrome")
          logo="file://"+str(pathlib.Path("assets/logo-header.jpg").resolve())
          soc=pathlib.Path("assets/newsroom/social"); soc.mkdir(parents=True,exist_ok=True)
          for html,w,h,name in [(H1,1200,1200,"2026-10-09-coupa-linkedin-1200.jpg"),(H2,1600,900,"2026-10-09-coupa-x-1600x900.jpg")]:
              td=tempfile.mkdtemp(); fn=os.path.join(td,"c.html"); png=os.path.join(td,"c.png")
              open(fn,"w").write(html.replace("LOGOSRC",logo))
              subprocess.run([CHROME,"--headless=new","--no-sandbox","--disable-gpu","--hide-scrollbars","--allow-file-access-from-files",f"--window-size={w},{h}",f"--screenshot={png}","--virtual-time-budget=6000","file://"+fn],check=True,capture_output=True)
              Image.open(png).convert("RGB").save(soc/name,"JPEG",quality=88,optimize=True)
              print("wrote",name,(soc/name).stat().st_size)
          w = pathlib.Path(f"assets/newsroom/{slug}.webp"); assert 3000 < w.stat().st_size < 150000
          pathlib.Path(".github/workflows/newsroom-2026-10-09-coupa.yml").unlink(missing_ok=True)
          print("ok")
          PY
      - name: Commit assembled Newsroom card
        run: |
          git config user.name "jwfounder"
          git config user.email "justinweller.jw@gmail.com"
          git add -A
          git status --short
          git commit -m "Newsroom: tech companies shift spend to IT services (Coupa, 2026-10-09)"
          git push origin HEAD:newsroom/2026-10-09
