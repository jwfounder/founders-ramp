name: OG JPG build (one-off)
on:
  push:
    branches: [blog/og-jpg]
    paths: [".github/workflows/og-jpg.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pillow==12.3.0
      - run: python3 .ogbuild/to_jpg.py
      - name: Commit and remove one-off files
        run: |
          md5sum assets/writings/*.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .ogbuild .github/workflows/og-jpg.yml
          git add -A writings assets/writings
          git commit -m "Blog: 1200x630 JPG og images for the WebP pages (removes one-off build)"
          git push
