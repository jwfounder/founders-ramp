name: Newsroom redesign build (one-off)
on:
  push:
    branches: [newsroom/redesign]
    paths: [".github/workflows/newsroom-build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 .newsroom/gen.py
      - name: Commit page and images, remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .newsroom .github/workflows/newsroom-build.yml
          git add briefing assets/newsroom
          git commit -m "Newsroom: preview cards with self-hosted images and topic tabs"
          git push
