name: Newsroom 2026-10-08 RepVue assemble (one-off, removes itself)
on:
  push:
    branches: [newsroom/2026-10-08]
    paths: [".github/workflows/newsroom-2026-10-08-repvue.yml"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newsroom/2026-10-08
          fetch-depth: 0
      - run: pip install pillow
      - name: Add card, refresh home strip, build WebP, remove one-off
        run: |
          python3 <<'PY'
          import pathlib, re
          from PIL import Image, ImageDraw, ImageFont
          W, H = 720, 378
          slug = "2026-10-08-only-41-percent-are-hitting-quota"
          url = "https://www.linkedin.com/posts/ryancwalsh_59-of-you-suck-at-your-jobs-since-only-share-7513942046160785409-KoN6/"
          title = "Only 41% are hitting quota"
          alt = "Bright illustration card reading Only 41% of sales reps are hitting quota, with bars for 41% hitting and 59% missing"
          source = "Ryan Walsh (RepVue)"
          body = "The reasons on this list are company decisions: raised targets, extra reps in a crowded territory, cut marketing, three sales VPs in four years. Good sellers check quota attainment before they join, so know yours before you hire."
          img = f'<span class="thumb"><img src="../assets/newsroom/{slug}.webp" alt="{alt}" width="720" height="378" loading="lazy" decoding="async"></span>'
          meta = '<span class="news-meta"><span class="news-topic">Founder-led sales</span> <time datetime="2026-10-08">2026-10-08</time></span>'
          I = " " * 10
          bcard = (f'{I}<a class="card news" href="{url}" target="_blank" rel="noopener" data-topic="founder">\n'
                   f'{I}  {img}\n{I}  <div class="news-body">\n{I}    {meta}\n{I}    <h3>{title}</h3>\n'
                   f'{I}    <p>{body}</p>\n{I}    <span class="news-source">{source}</span>\n{I}  </div>\n{I}</a>\n')
          hcard = (f'{I}<a class="card news" href="{url}" target="_blank" rel="noopener">\n'
                   f'{I}  {img}\n{I}  <div class="news-body">\n{I}    {meta}\n{I}    <h3>{title}</h3>\n'
                   f'{I}    <span class="news-source">{source}</span>\n{I}  </div>\n{I}</a>\n')
          b = pathlib.Path("briefing/index.html"); s = b.read_text(encoding="utf-8")
          assert url not in s
          a = '        <div class="cards news-grid">\n'; assert s.count(a) == 1
          s = s.replace(a, a + bcard, 1)
          s = s.replace('aria-pressed="true">All <span>33</span>', 'aria-pressed="true">All <span>34</span>', 1)
          s = s.replace('Founder-led sales <span>6</span>', 'Founder-led sales <span>7</span>', 1)
          assert 'All <span>34</span>' in s and 'Founder-led sales <span>7</span>' in s
          assert s.count('class="card news"') == 34 and s.count('data-topic="founder"') == 7, (s.count('class="card news"'), s.count('data-topic="founder"'))
          b.write_text(s, encoding="utf-8")
          h = pathlib.Path("home/index.html"); s = h.read_text(encoding="utf-8")
          a = '        <div class="cards news-strip">\n'; assert s.count(a) == 1
          s = s.replace(a, a + hcard, 1)
          s, n = re.subn(r' {10}<a class="card news" href="https://sapinsider\.org/blogs/orchestration-extended-sap-to-sell-oro-labs-platform/" target="_blank" rel="noopener">\n.*?</a>\n', "", s, count=1, flags=re.S)
          assert n == 1
          strip = s.split('cards news-strip')[1].split('<section')[0]
          assert strip.count('class="card news"') == 3, strip.count('class="card news"')
          h.write_text(s, encoding="utf-8")
          im = Image.new("RGB", (W, H), (14, 165, 233))
          d = ImageDraw.Draw(im)
          d.rectangle([0, 0, W, 28], fill=(244, 63, 94))
          d.rectangle([0, H - 28, W, H], fill=(250, 204, 21))
          d.rounded_rectangle([44, 52, W - 44, H - 52], radius=20, fill=(255, 255, 255))
          try:
              lg = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 32)
              md = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 22)
              sm = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 19)
          except Exception:
              lg = ImageFont.load_default(size=32); md = ImageFont.load_default(size=22); sm = ImageFont.load_default(size=19)
          d.text((72, 74), "Only 41% of sales reps", fill=(15, 23, 42), font=lg)
          d.text((72, 116), "are hitting quota", fill=(15, 23, 42), font=lg)
          d.text((72, 166), "Ryan Walsh (RepVue) on LinkedIn", fill=(71, 85, 105), font=sm)
          bars = [("Hitting quota", 41, (16, 185, 129)), ("Missing quota", 59, (249, 115, 22))]
          x0, maxw = 260, 300
          for i, (lab, v, c) in enumerate(bars):
              y = 214 + i * 44
              d.text((72, y + 2), lab, fill=(30, 41, 59), font=sm)
              w = max(10, int(maxw * v / 59))
              d.rounded_rectangle([x0, y, x0 + w, y + 28], radius=6, fill=c)
              d.text((x0 + w + 10, y + 2), f"{v}%", fill=(30, 41, 59), font=md)
          out = pathlib.Path(f"assets/newsroom/{slug}.webp"); out.parent.mkdir(parents=True, exist_ok=True)
          im.save(out, "WEBP", quality=82, method=6)
          assert 3000 < out.stat().st_size < 150000, out.stat().st_size
          pathlib.Path(".github/workflows/newsroom-2026-10-08-repvue.yml").unlink(missing_ok=True)
          print("ok", out.stat().st_size)
          PY
      - name: Commit assembled Newsroom card
        run: |
          git config user.name "jwfounder"
          git config user.email "justinweller.jw@gmail.com"
          git add -A
          git status --short
          git commit -m "Newsroom: only 41% of reps are hitting quota (RepVue, 2026-10-08)"
          git push origin HEAD:newsroom/2026-10-08
