name: Newsroom og build (one-off)
on:
  push:
    branches: [newsroom/og-image]
    paths: [".github/workflows/newsroom-og.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pillow==12.3.0
      - name: Fonts (Barlow Condensed, OFL)
        run: |
          mkdir -p /tmp/fonts
          for w in Bold ExtraBold SemiBold; do curl -sfLo /tmp/fonts/BarlowCondensed-$w.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-$w.ttf; done
          md5sum /tmp/fonts/*
      - run: FONTDIR=/tmp/fonts python3 .ogbuild/og_briefing.py
      - name: Commit and remove one-off files
        run: |
          md5sum assets/newsroom/briefing-index.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .ogbuild .github/workflows/newsroom-og.yml
          git add -A briefing assets/newsroom
          git commit -m "Newsroom: 1200x630 og image for /briefing/ (removes one-off build)"
          git push
