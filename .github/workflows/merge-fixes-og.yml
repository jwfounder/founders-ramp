name: One-off merge site fixes and home og image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==12.3.0
      - name: Fonts (OFL, same files as the local render)
        run: |
          mkdir -p /tmp/fonts
          curl -sfLo /tmp/fonts/bc.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf
          curl -sfLo /tmp/fonts/plex.ttf 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsans/IBMPlexSans%5Bwdth,wght%5D.ttf'
          echo "f599739e94768bec57f6899c422a5119  /tmp/fonts/bc.ttf" | md5sum -c
          echo "335a2b2a3a6464bdbee78a93848f07e8  /tmp/fonts/plex.ttf" | md5sum -c
      - name: Rebase site/fixes-2026-10-02, add home og image, fast-forward main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin site/fixes-2026-10-02
          FX=$(git rev-parse FETCH_HEAD)
          test "$(git rev-parse --short=7 $FX)" = "5bc8f65"
          git rm -q .github/workflows/merge-fixes-og.yml
          git commit -q -m "Remove one-off merge workflow for site fixes and home og image"
          START=$(git rev-parse HEAD)
          OLD=$(git merge-base HEAD $FX)
          git checkout -q -b tmp $FX
          git rebase -q --onto $START $OLD tmp
          cat > /tmp/gen_og.py <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          R=os.environ.get('REPO','.'); FD=os.environ['FONTDIR']
          bold=os.path.join(FD,'bc.ttf'); VF=os.path.join(FD,'plex.ttf')
          def plex(size,style):
              f=ImageFont.truetype(VF,size); f.set_variation_by_name(style); return f
          W,H=1200,630
          BG=(242,244,248); INK=(22,22,22); MUTED=(82,82,82); RED=(225,6,0)
          img=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(img)
          logo=Image.open(os.path.join(R,'assets/logo.jpg')).convert('RGB')
          PW=540
          bgsrc=logo.resize((int(1280*H/720),H),Image.LANCZOS)
          l=(bgsrc.width-PW)//2
          panel=bgsrc.crop((l,0,l+PW,H)).filter(ImageFilter.GaussianBlur(60))
          fg=logo.crop((250,70,1030,640))
          s=(PW-40)/fg.width; fg=fg.resize((PW-40,int(fg.height*s)),Image.LANCZOS)
          mask=Image.new('L',fg.size,0); ImageDraw.Draw(mask).rectangle([24,24,fg.width-24,fg.height-24],fill=255); mask=mask.filter(ImageFilter.GaussianBlur(14))
          panel.paste(fg,(20,(H-fg.height)//2),mask)
          PX=W-PW; img.paste(panel,(PX,0)); d.rectangle([PX,0,PX+5,H],fill=RED)
          x=72
          d.rectangle([x,100,x+64,108],fill=RED)
          d.text((x,128),"FOUNDERS RAMP",font=plex(24,b'SemiBold'),fill=RED)
          hf=ImageFont.truetype(bold,78); y=184
          for t in ["Build a repeatable","go-to-market","strategy."]:
              d.text((x,y),t,font=hf,fill=INK); y+=84
          d.text((x,H-100),"www.foundersramp.net",font=plex(24,b'Regular'),fill=MUTED)
          out=os.path.join(R,'assets/home-og.jpg')
          img.save(out,quality=86,optimize=True,progressive=True)
          print(out, os.path.getsize(out))
          PY
          REPO=. FONTDIR=/tmp/fonts python /tmp/gen_og.py
          md5sum assets/home-og.jpg
          python -c "from PIL import Image; im=Image.open('assets/home-og.jpg'); assert im.size==(1200,630), im.size; print(im.size)"
          test $(stat -c %s assets/home-og.jpg) -lt 153600
          OLDTAG='<meta property="og:image" content="https://www.foundersramp.net/assets/logo.jpg">'
          NEWTAG='<meta property="og:image" content="https://www.foundersramp.net/assets/home-og.jpg">'
          test "$(grep -cF "$OLDTAG" home/index.html)" = "1"
          sed -i "s#$OLDTAG#$NEWTAG#" home/index.html
          grep -cF "$NEWTAG" home/index.html
          git add assets/home-og.jpg home/index.html
          git commit -q -m "Home: its own 1200x630 og:image built from the logo and headline"
          CHANGED=$(git diff --name-only $START HEAD | grep -v '^home/index.html$' | grep -v '^briefing/index.html$' | grep -v '^writings/index.html$' | grep -v '^assets/writings/blog-index.jpg$' | grep -v '^assets/home-og.jpg$' || true)
          if [ -n "$CHANGED" ]; then echo "Unexpected paths: $CHANGED"; exit 1; fi
          test -z "$(git ls-files .github/workflows .fixbuild)"
          git log --oneline -6
          git push origin HEAD:main
