name: Site fixes build (one-off)
on:
  push:
    branches: [site/fixes-2026-10-02]
    paths: [".github/workflows/site-fixes.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pillow==12.3.0
      - name: Fonts (Barlow Condensed, OFL)
        run: |
          mkdir -p /tmp/fonts
          for w in Bold ExtraBold SemiBold; do curl -sfLo /tmp/fonts/BarlowCondensed-$w.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-$w.ttf; done
          md5sum /tmp/fonts/*
      - run: python3 .fixbuild/fix_cards.py
      - run: FONTDIR=/tmp/fonts python3 .fixbuild/og_index.py
      - name: Commit and remove one-off files
        run: |
          md5sum assets/writings/blog-index.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .fixbuild .github/workflows/site-fixes.yml
          git add -A home briefing writings assets/writings
          git commit -m "Newsroom links open in a new tab, div card bodies, blog index og image (removes one-off build)"
          git push
