name = "founders-ramp-web"
main = "src/worker.js"
compatibility_date = "2026-09-10"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[durable_objects.bindings]]
name = "FR_STORE"
class_name = "FrStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FrStore"]

[vars]
# First Seller welcome stays off until Skipper's final check. Secrets (wrangler secret put): RESEND_API_KEY, RESEND_AUDIENCE_ID, UNSUB_SECRET
# (all three required; if the switch is on and one is missing, nothing sends and the Worker logs the missing name).
FIRST_SELLER_EMAIL = "on"

# Every 30 min: retry First Seller welcomes skipped at the daily cap or on a Resend 429/5xx (no-op while FIRST_SELLER_EMAIL is off).
[triggers]
crons = ["*/30 * * * *"]
